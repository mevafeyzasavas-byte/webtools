plugins { id 'com.android.application' }

// Uygulamanın açacağı adres. GitHub'da Settings > Variables > APP_URL ile değiştirilebilir.
def appUrl = System.getenv("APP_URL") ?: "https://coreg.rf.gd/tools.html"
def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.webtools.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.webtools.app'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
        buildConfigField "String", "APP_URL", "\"${appUrl}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'webtools123'
            keyAlias 'webtools'
            keyPassword 'webtools123'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
}
